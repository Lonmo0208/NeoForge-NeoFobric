neogradle.runtime.platform.installer.debug=true

# NeoFobric: build the fabric-loader fat jar from the fabric-loader checkout (the submodule at
# <root>/fabric-loader). The bridge compiles against that checkout's internals - its shaded gson and
# its class-tweaker API - and the released net.fabricmc:fabric-loader jar bundles different versions
# of both, so local mode is the supported build. settings.gradle fetches the submodule on demand for
# a plain clone; set this to false only to try a jar resolved from Maven.
neofobric.fabricLoader.local=true

# The version to resolve from Maven when there is no checkout to read it from. A checkout that
# exists always wins, so this only has to move when the pin does.
neofobric.fabricLoader.version=0.20.1.1

# NeoFobric: the game version the Fabric layer answers dependency ranges with. 26w14a is not a
# semantic version, which fabric-loader refuses outright; this branch runs 26.1.2 mods, so it
# answers as 26.1.2. Leave empty to report the discovered MC version unchanged.
neofobric.fabricGameVersion=26.1.2

# NeoFobric: the version FML answers NeoForge mod dependency ranges with. FML derives it from
# version.json's id in dev (and from --fml.mcVersion in production); the snapshot id "26w14a"
# makes every mod built for 26.1.2 fail its range check before the game starts. The snapshot
# keeps its own data/protocol/pack formats - only the version the mod checks see is replaced.
neofobric.minecraftCompatVersion=26.1.2

# NeoFobric: the protocol number version.json advertises to mods that read the resource. 26w14a's
# snapshot protocol (1073742129) passes ">= 777" checks that mods use as "this game has the SDL
# input backend" (IMBlocker), which then calls LWJGL SDL classes that do not exist here. 775 is
# 26.1.2's number, which is what the branch emulates. The network handshake uses the constant in
# SharedConstants, so the wire protocol and vanilla 26w14a connectivity are not affected.
neofobric.minecraftCompatProtocol=775

# NeoFobric: the version every build reports. Pinning it here (or with -Pversion) makes the build
# ignore git tags entirely, which matters because a GitHub *release* keeps a tag in this branch's
# history forever - and a tag inside the build range turns the version calculator's output into
# "26.1.26w14a.0-beta-26w14a-NeoFobric", a form FML refuses to launch.
# Bump it for a release (tools/build-installer.sh does that and builds the installer).
version=26.1.26w14a.127-26w14a-NeoFobric

# NeoFobric: the version the *neoforge mod* declares, which is what FML answers NeoForge mod
# dependency ranges with (FMLLoader#runDiscovery replaces --fml.neoForgeVersion with the discovered
# mod's version, so this applies in dev and production alike). 26.1.2-built mods commonly require
# [26.1.2,26.1.3), and the branch's own "26.1.26w14a.N" sorts above that range's upper bound
# (Maven versioning puts 26.1.26w14a > 26.1.3), so the mod-declared version stays on the emulated
# 26.1.2 line while the artifact, tag and installer keep `version` above. Leave empty to let the
# neoforge mod declare `version` as-is.
neofobric.neoforgeModVersion=26.1.2.127-26w14a-NeoFobric
