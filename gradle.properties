# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for recompilation
# (see also projects/neoforged/build.gradle, where the compile tasks is set to have enough memory when forked)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.debug=false
#org.gradle.warning.mode=fail

# renovate: net.neoforged:moddev-gradle
moddevgradle_plugin_version=2.0.140
# renovate: io.codechicken:DiffPatch
diffpatch_version=2.1.0.43

java_version=25

minecraft_version=26w14a
neoform_version=1
# on snapshot versions, used to prefix the version
# should always have 3 components (major.minor.hotfix)
neoforge_snapshot_next_stable=26.1.26w14a

# renovate: net.neoforged.jst:jst-cli-bundle
jst_version=1.0.67
legacyinstaller_version=3.0.+
# renovate: net.neoforged.installertools:installertools
installertools_version=4.0.12

# renovate: org.ow2.asm:asm
asm_version=9.9.1

mergetool_version=2.0.0
accesstransformers_version=11.0.1
eventbus_version=8.0.5
mixin_version=0.17.4+mixin.0.8.7
