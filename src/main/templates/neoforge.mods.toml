modLoader="javafml"
loaderVersion="[3,]"
issueTrackerURL="https://github.com/neoforged/NeoForge/issues"
logoFile="neoforged_logo.png"
license="LGPL v2.1"

[[mods]]
    modId="neoforge"
    # We use the global NeoForge version
    # NeoFobric: FML answers mods' `neoforge` dependency ranges with this version, so it stays on the
    # emulated 26.1.2 line even though the artifact carries the branch's own snapshot version.
    version="${neoforge_mod_version}"
    #updateJSONURL="https://maven.neoforged.net/releases/net/neoforged/forge/promotions_slim.json"
    displayName="NeoForge"
    credits="Anyone who has contributed on Github and supports our development"
    authors="The NeoForged Team"
    description='''
    NeoForge, a NEW broad compatibility API.
    '''

[[mixins]]
    config = "neoforge.mixins.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"
[[accessTransformers]]
    file="META-INF/accesstransformergenerated.cfg"
